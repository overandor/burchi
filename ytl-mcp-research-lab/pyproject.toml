[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytl-mcp-research-lab"
version = "0.1.0"
description = "YouTube Automation Research Lab MCP Server (compliance-first, receipt-backed)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "YTL Research Lab"}]
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "httpx==0.27.0",
  "tenacity==8.2.3"
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "ruff==0.5.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
